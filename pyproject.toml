[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long — regex patterns and log samples are intentionally long
    "E741",   # ambiguous variable names — 'm' and 'p' are idiomatic here
    "F401",   # unused imports — conftest.py imports docktail for its side-effect
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # test files redefine names across classes

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"