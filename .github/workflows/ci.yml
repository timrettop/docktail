name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright pytest pytest-cov

      - name: Lint (ruff)
        run: ruff check docktail.py tests/

      - name: Type check (pyright)
        # Non-blocking while the codebase is still being typed up.
        # Remove continue-on-error once all type issues are resolved.
        continue-on-error: true
        run: pyright docktail.py

      - name: Test
        run: pytest tests/ -v --tb=short --cov=docktail --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage